<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xat Space - Rei</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="xat-space-container" onclick="iniciarMusica()">

        <div class="xat-stars"></div>

        <div class="xat-shooting"></div>
        <div class="xat-shooting"></div>
        <div class="xat-shooting"></div>

        <table class="xat-main-layout">
            <tr>
                <td class="xat-top-cell">
                    <div class="xat-center-block">
                        <h1 class="xat-name-rei">Rei</h1>
                        <div class="xat-divider">
                            <div class="xat-diamond"></div>
                        </div>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="xat-bottom-cell">
                    <div class="xat-controls-wrapper">
                        <button class="xat-music-btn xat-btn-play" onclick="botonPlay(event)">PLAY</button>
                        <button class="xat-music-btn xat-btn-pause" onclick="botonPause(event)">PAUSA</button>
                    </div>
                </td>
            </tr>
        </table>

        <iframe id="xat-player"
                style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: none; top: 0; left: 0;" 
                src="https://www.youtube.com/embed/328Z3b77k6Y?enablejsapi=1&autoplay=0&loop=1&playlist=328Z3b77k6Y" 
                allow="autoplay">
        </iframe>

    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('xat-player');
        }

        function iniciarMusica() {
            if (player && typeof player.playVideo === 'function') {
                player.playVideo();
            }
        }

        function botonPlay(event) {
            event.stopPropagation(); 
            if (player && typeof player.playVideo === 'function') {
                player.playVideo();
            }
        }

        function botonPause(event) {
            event.stopPropagation(); 
            if (player && typeof player.pauseVideo === 'function') {
                player.pauseVideo();
            }
        }
    </script>

</body>
</html>
