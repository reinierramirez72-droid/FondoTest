<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xat Space - Rei</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="xat-space-container">

        <div class="xat-stars"></div>

        <div class="xat-shooting"></div>
        <div class="xat-shooting"></div>
        <div class="xat-shooting"></div>

        <div class="xat-center-block">
            <h1 class="xat-name-rei">Rei</h1>
            <div class="xat-divider">
                <div class="xat-diamond"></div>
            </div>
        </div>

        <div class="xat-player-container">
            <button class="xat-play-btn" onclick="controlarAudio(event)" title="Reproducir / Pausar">
                <div class="xat-icon-shape xat-state-play" id="xat-icon"></div>
            </button>
            
            <div class="xat-song-info">
                <span class="xat-song-title">Desde Que Te Tengo</span>
                <span class="xat-song-artist">Carín León</span>
            </div>
        </div>

        <audio id="xat-bg-audio" loop>
            <source src="cancion.mp3.mp3" type="audio/mpeg">
            Tu navegador no soporta este elemento de audio.
        </audio>

    </div>

    <script>
        const miAudio = document.getElementById('xat-bg-audio');
        const miIcono = document.getElementById('xat-icon');

        function controlarAudio(event) {
            event.stopPropagation(); // Evita conflictos con el fondo
            
            if (miAudio.paused) {
                miAudio.play().then(() => {
                    miIcono.className = "xat-icon-shape xat-state-pause";
                }).catch(error => {
                    console.log("Error al reproducir: ", error);
                });
            } else {
                miAudio.pause();
                miIcono.className = "xat-icon-shape xat-state-play";
            }
        }
    </script>

</body>
</html>
