<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xat Space - Rei</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="xat-space-container">

        <div class="xat-stars"></div>

        <div class="xat-shooting"></div>
        <div class="xat-shooting"></div>
        <div class="xat-shooting"></div>

        <div class="xat-center-block">
            <h1 class="xat-name-rei">Rei</h1>
            <div class="xat-divider">
                <div class="xat-diamond"></div>
            </div>
        </div>

        <div class="xat-player-container">
            <button class="xat-play-btn" id="xat-toggle-btn" onclick="controlarMusica(event)" title="Reproducir / Pausar">
                <div class="xat-icon-shape" id="xat-icon"></div>
            </button>
            <div class="xat-song-info">
                <span class="xat-song-title">Desde Que Te Tengo</span>
                <span class="xat-song-artist">Carín León</span>
            </div>
        </div>

        <iframe id="xat-player-iframe"
                style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: none; top: 0; left: 0;" 
                src="https://www.youtube.com/embed/328Z3b77k6Y?enablejsapi=1&autoplay=0&loop=1&playlist=328Z3b77k6Y" 
                allow="autoplay">
        </iframe>

    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var estaReproduciendo = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('xat-player-iframe', {
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // Monitorea si la canción cambia de estado externamente
        function onPlayerStateChange(event) {
            const icon = document.getElementById('xat-icon');
            // Si está reproduciendo (estado 1)
            if (event.data == YT.PlayerState.PLAYING) {
                estaReproduciendo = true;
                icon.className = "xat-icon-shape xat-state-pause";
            } else {
                estaReproduciendo = false;
                icon.className = "xat-icon-shape xat-state-play";
            }
        }

        // Controla la acción del botón único
        function controlarMusica(event) {
            event.stopPropagation(); // Evita conflictos de clics
            if (player && typeof player.playVideo === 'function') {
                if (!estaReproduciendo) {
                    player.playVideo();
                } else {
                    player.pauseVideo();
                }
            }
        }
    </script>

</body>
</html>
