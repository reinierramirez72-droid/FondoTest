<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xat Space - Ʀɛɨ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="xat-space-container" onclick="activarMusicaFondo()" id="space-container">

        <div class="xat-mouse-glow" id="mouse-glow"></div>

        <div class="xat-smoke-layer xat-smoke-1"></div>
        <div class="xat-smoke-layer xat-smoke-2"></div>
        <div class="xat-smoke-layer xat-smoke-3"></div>

        <div class="xat-single-star"></div>

        <div class="xat-center-block">
            <h1 class="xat-name-rei-shimmer">Ʀɛɨ</h1>
            <div class="xat-divider">
                <div class="xat-diamond"></div>
            </div>
        </div>

        <div class="xat-player-container">
            <button class="xat-play-btn" onclick="controlarAudio(event)" title="Reproducir / Pausar">
                <div class="xat-icon-shape xat-state-play" id="xat-icon"></div>
            </button>
            <div class="xat-song-info">
                <span class="xat-song-title">Desde Que Te Tengo</span>
                <span class="xat-song-artist">Carín León</span>
            </div>
        </div>

        <audio id="xat-bg-audio" loop>
            <source src="cancion.mp3.mp3" type="audio/mpeg">
            Tu navegador no soporta este elemento de audio.
        </audio>

    </div>

    <script>
        const miAudio = document.getElementById('xat-bg-audio');
        const miIcono = document.getElementById('xat-icon');
        const contenedor = document.getElementById('space-container');
        const luzFoco = document.getElementById('mouse-glow');
        let musicaIniciada = false;

        // LÓGICA JAVASCRIPT PARA SEGUIR EL MOUSE
        contenedor.addEventListener('mousemove', (e) => {
            const rect = contenedor.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            luzFoco.style.background = `radial-gradient(circle 250px at ${x}px ${y}px, rgba(255, 255, 255, 0.05) 0%, transparent 80%)`;
        });

        function activarMusicaFondo() {
            if (!musicaIniciada) {
                miAudio.play().then(() => {
                    miIcono.className = "xat-icon-shape xat-state-pause";
                    musicaIniciada = true;
                }).catch(error => {
                    console.log("Esperando interacción para activar audio.");
                });
            }
        }

        function controlarAudio(event) {
            event.stopPropagation();
            if (miAudio.paused) {
                miAudio.play().then(() => {
                    miIcono.className = "xat-icon-shape xat-state-pause";
                    musicaIniciada = true;
                });
            } else {
                miAudio.pause();
                miIcono.className = "xat-icon-shape xat-state-play";
            }
        }
    </script>

</body>
</html>
